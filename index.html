<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanach Rhyme Search</title><style>body{max-width:850px;margin:3rem auto;padding:0 1rem;color:#253232;font:17px system-ui;background:#faf9f4}h1{margin-bottom:0}h2{font-weight:400;margin-top:.3rem}input{font-size:1.5rem;padding:.6rem;width:min(90%,400px)}button{font-size:1.1rem;padding:.45rem .7rem;margin:.2rem;background:white;border:1px solid #bbc8c3;border-radius:5px;cursor:pointer}.go{background:#315d53;color:white}details{background:white;margin:.6rem 0;padding:1rem;border:1px solid #d6ded8;border-radius:6px}summary{cursor:pointer;font-size:1.25rem}.verse{padding:.7rem 0;border-top:1px solid #eee;line-height:1.9}small{color:#53665f}#status{min-height:2em}</style><main><h1 lang="he" dir="rtl">תנ״ך — חיפוש חרוזים</h1><h2>Tanach Rhyme Search</h2><p>Enter the final syllable of a Hebrew word, including nikkud.</p><form id="form"><input id="query" dir="rtl" lang="he" value="פַּז" aria-label="Hebrew ending"><button class="go">Find rhymes</button></form><p>Hebrew letters</p><div id="letters" dir="rtl"></div><p>Nikkud</p><div id="vowels" dir="rtl"></div><p id="status" role="status">Loading Tanach…</p><section id="results"></section><p><small>Text: <a href="https://he.wikisource.org/wiki/משתמש:Dovi/מקרא_על_פי_המסורה">Miqra according to the Masorah</a>, via Sefaria; CC BY-SA. Rhyme matching follows the original app’s spelling and vowel equivalences.</small></p></main><script>
const books=['1%20Chronicles','1%20Kings','1%20Samuel','2%20Chronicles','2%20Kings','2%20Samuel','Amos','Daniel','Deut','Ecclesiastes','Esther','Exodus','Ezekiel','Ezra','Gen','Habakkuk','Haggai','Hosea','Isaiah','Jeremiah','Job','Joel','Jonah','Joshua','Judges','Lamentations','Lev','Malachi','Micah','Nahum','Nehemiah','Num','Obadiah','Proverbs','Psalms','Ruth','Zechariah','Zephaniah'];
const input=document.querySelector('#query'),status=document.querySelector('#status'),results=document.querySelector('#results');let lex=new Map();
function addButtons(id,items){const box=document.querySelector(id);for(const [label,value] of items){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>{let p=input.selectionStart;input.setRangeText(value,p,input.selectionEnd,'end');input.focus()});box.append(b)}}
addButtons('#letters',[...Array.from('אבגדהוזחטיךכלםמןנסעףפץצקרשת'), 'שׁ','שׂ'].map(x=>[x,x]));addButtons('#vowels',[['פַּתַח','ַ'],['קָמַץ','ָ'],['צֵירֵי','ֵ'],['סֶגוֹל','ֶ'],['חִירִיק','ִ'],['שְׁוָא','ְ'],['קֻבּוּץ','ֻ'],['דָּגֵשׁ','ּ'],['חוֹלָם','ֹ'],['חֲטַף פַּתַח','ֲ'],['חֳטַף קָמַץ','ֳ'],['חֱטַף סֶגוֹל','ֱ'],['שׁוּרוּק','וּ'],['חוֹלָם וָו','וֹ'],['חִירִיק יוֹד','ִי'],['צֵירֵי יוֹד','ֵי']]);
const clean=s=>s.replace(/[\u0591-\u05af\u05c3\[\]()]/g,'');const noD=s=>s.replace(/ּ/g,'');const equiv=[['וֹ','ֹ'],['וּ','ֻ'],['ִי','ִ'],['ֵי','ֵ'],['ֱ','ֶ'],['ֳ','ֹ'],['ֲ','ַ'],['ֹ','וֹ'],['ֻ','וּ'],['ִ','ִי'],['ֵ','ֵי'],['ֶ','ֱ'],['ֹ','ֳ'],['ַ','ֲ']];
function matches(word,end){end=noD(end);return noD(word).endsWith(end)||equiv.some(([a,b])=>word.replaceAll(a,b).endsWith(end))}
function show(){let q=clean(input.value.trim());results.replaceChildren();if(!q){status.textContent='Enter a syllable to search.';return}let matchesList=[...lex.keys()].filter(w=>matches(w,q)).sort((a,b)=>a.replace(/[\u0591-\u05c7]/g,'').localeCompare(b.replace(/[\u0591-\u05c7]/g,''),'he'));status.textContent=`${matchesList.length} rhymes found`;let count=0;function more(){for(const word of matchesList.slice(count,count+30)){let d=document.createElement('details'),s=document.createElement('summary');s.dir='rtl';s.textContent=word+' ('+lex.get(word).length+')';d.append(s);d.addEventListener('toggle',()=>{if(!d.open||d.dataset.loaded)return;d.dataset.loaded='1';for(const entry of lex.get(word)){let v=document.createElement('div');v.className='verse';v.dir='rtl';for(const part of entry.text.split(/(־| )/)){if(part===word){let strong=document.createElement('strong');strong.textContent=part;v.append(strong)}else v.append(document.createTextNode(part))}let loc=document.createElement('small');loc.dir='ltr';loc.textContent=' '+entry.loc;v.append(loc);d.append(v)}});results.append(d)}count+=30;button.hidden=count>=matchesList.length}let button=document.createElement('button');button.textContent='Show more';button.onclick=()=>{button.remove();more();results.append(button)};more();results.append(button)}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();show()});
Promise.all(books.map(async name=>{let r=await fetch('data/'+encodeURIComponent(name)+'.json');if(!r.ok)throw Error(name);return r.json()})).then(all=>{for(const data of all){const name=data.available_versions[0].title;data.versions[0].text.forEach((chapter,ci)=>chapter.forEach((verse,vi)=>{let text=clean(verse);for(const word of new Set(text.split(/־| /).filter(Boolean))){if(!lex.has(word))lex.set(word,[]);lex.get(word).push({text,loc:`${name} ${ci+1}:${vi+1}`})}}))}show()}).catch(e=>{status.textContent='Unable to load the text. Please refresh and try again.';console.error(e)});
</script></html>
